# S1/B12: atualizacoes semanais. As actions estao pinadas por SHA; o Dependabot troca o SHA e o comentario da versao.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
